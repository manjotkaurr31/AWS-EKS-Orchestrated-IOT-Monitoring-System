apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-api
  namespace: telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-api
  template:
    metadata:
      labels:
        app: telemetry-api
    spec:
      serviceAccountName: telemetry-api-sa
      containers:
      - name: api
        image: 370613533360.dkr.ecr.ap-south-1.amazonaws.com/api:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: telemetry-secret
        - configMapRef:
            name: telemetry-config
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
